[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ"]
ignore = [
  "S101",  # assert is fine in tests
  "B904",
  "E501",  # long lines handled by formatter where possible
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"config/settings/*" = ["F403", "F405", "E402"]
