# Render Blueprint: free API + free Postgres.
# Free web services sleep after 15 minutes idle; free Postgres expires after 30 days.
# The SPA is hosted separately (Vercel). Cookies are cross-site (SameSite=None; Secure).
databases:
  - name: paypilot-db
    plan: free
    databaseName: paypilot
    user: paypilot

services:
  - type: web
    name: paypilot-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health/live/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: paypilot-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: paypilot-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: WEB_CONCURRENCY
        value: "2"
