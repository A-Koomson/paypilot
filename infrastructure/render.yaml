# Render Blueprint for the PayPilot API (Django). See docs/deployment.md.
# The database is expected to be a Neon PostgreSQL instance supplied via DATABASE_URL
# (Render's own managed Postgres also works; it is just a connection string).
services:
  - type: web
    name: paypilot-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free            # Free instances sleep when idle and have limited hours; verify current limits.
    healthCheckPath: /api/health/ready/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false       # e.g. paypilot-api.onrender.com
      - key: DATABASE_URL
        sync: false       # Neon connection string (must include sslmode=require)
      - key: FRONTEND_URL
        sync: false       # https://<your-project>.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false       # same as FRONTEND_URL
      - key: CSRF_TRUSTED_ORIGINS
        sync: false       # same as FRONTEND_URL
      # With the Vercel /api rewrite the browser only ever talks to the Vercel origin, so the
      # default SameSite=Lax cookies work. Only set SESSION_COOKIE_SAMESITE=None if you point the
      # SPA directly at the Render host instead of using the rewrite.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
